version: '3.8'
services:
  ticket-frontend:
    image: registrycbbadev.et.bo/ticket/ticket-frontend:test
    container_name: ticket-frontend
    ports:
      - "9012:80"
    networks:
      - et-clicket-test-net
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - /etc/localtime:/etc/localtime:ro
networks:
  et-clicket-test-net:
    external: true
