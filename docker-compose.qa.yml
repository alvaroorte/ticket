version: '3.8'
services:
  ticket-frontend:
    image: registrycbbadev.et.bo/ticket/ticket-frontend:qa
    container_name: ticket-frontend
    ports:
      - "9022:80"
    networks:
      - et-clicket-qa-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role==worker]
    volumes:
      - /etc/localtime:/etc/localtime:ro
networks:
  et-clicket-qa-net:
    external: true
