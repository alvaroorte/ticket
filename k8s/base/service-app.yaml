apiVersion: v1
kind: Service
metadata:
  name: ticket-frontend
  labels:
    app: ticket-frontend
spec:
  selector:
    app: ticket-frontend
  ports:
    - name: http
      protocol: TCP
      port: 9022          # Puerto interno del Service (expuesto por Ingress)
      targetPort: http    # Apunta al puerto nombrado del contenedor (80)
  type: ClusterIP
