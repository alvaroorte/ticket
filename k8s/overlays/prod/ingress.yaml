apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-ticket-frontend-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: ticket.endesyc.bo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-frontend
                port:
                  number: 9032
