version: '3.8'
services:
  ticket-frontend:
    image: registrycbbadev.et.bo/ticket/ticket-frontend:$TAG_IMAGE
    ports:
      - "9032:80"
    networks:
      - et-clicket-prod-net
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      mode: replicated
      replicas: 3

networks:
  et-clicket-prod-net:
    external: true