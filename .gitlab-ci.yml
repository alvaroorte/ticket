stages:
  - build
  - deploy_dev
  - build_test
  - deploy_test
  - build_k8s_qa
  - deploy_k8s_qa
  - build_etr
  - build_prod
  - deploy_prod

variables:
  GITLAB_REGISTRY: registrycbbadev.et.bo
  PROJECT_NAME: ticket-frontend
  DOCKER_IMAGE_BASE: $GITLAB_REGISTRY/ticket/$PROJECT_NAME
  PRODUCTION_VERSION: $PRODUCTION_VERSION
  PREVIOUS_VERSION: $PREVIOUS_VERSION
  # CI_DEBUG_TRACE: "true"

build:
  stage: build
  tags:
    - ticket-v2-dev-runner
  script:
    - |
      docker build --build-arg BUILD_ENV=dev -f Dockerfile -t $DOCKER_IMAGE_BASE:dev .
      docker push $DOCKER_IMAGE_BASE:dev
  only:
    - develop

deploy_dev:
  stage: deploy_dev
  tags:
    - ticket-v2-dev-runner
  script:
    - |
      docker stop $PROJECT_NAME || true
      docker rm $PROJECT_NAME || true
      docker rmi $DOCKER_IMAGE_BASE:dev || true

      echo "Desplegando servicio con Docker Compose..."
      docker compose -f docker-compose.dev.yml up -d
  only:
    - develop

build_test:
  stage: build_test
  tags:
    - ticket-v2-test-runner
  script:
    - |
      if [ $(docker images $DOCKER_IMAGE_BASE:test) ]; then
        docker rmi $DOCKER_IMAGE_BASE:test
      fi
      echo "GENERANDO IMAGEN :TEST para $DOCKER_IMAGE_BASE ..."
      docker build --build-arg BUILD_ENV=test -f Dockerfile -t $DOCKER_IMAGE_BASE:test .
      docker push $DOCKER_IMAGE_BASE:test
  only:
    - test

deploy_test:
  stage: deploy_test
  tags:
    -  ticket-v2-test-runner
  script:
    - echo "DESPLIEGUE FINAL EN AMBIENTE TEST..."
    - scp -p docker-compose.test.yml root@10.240.74.20:/opt/volumenes-nfs/et-clicket-test/docker-composes/frontend
    - ssh root@10.240.74.20 'docker stack deploy -c /opt/volumenes-nfs/et-clicket-test/docker-composes/frontend/docker-compose.test.yml --with-registry-auth et-clicket-test'
  only:
    - test

build_k8s_qa:
  stage: build_k8s_qa
  tags:
    - ticket-v2-qa-runner
  script:
    - |
      docker build --build-arg BUILD_ENV=qa -f Dockerfile -t $DOCKER_IMAGE_BASE:qa .
      docker push $DOCKER_IMAGE_BASE:qa
  only:
    - qa

deploy_k8s_qa:
  stage: deploy_k8s_qa
  tags:
    - ticket-v2-qa-runner
  variables:
    KUSTOMIZE_DIR: k8s/overlays/qa
    NAMESPACE: ticket-qa
  before_script:
    - |
      ls -la
      kubectl version --client
      echo "$KUBECONFIG_CONTENT" | base64 -d > kubeconfig
      echo "$KUBECONFIG_CONTENT" | base64 -d | head -n 10
      export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
      kubectl config use-context $KUBECONFIG_CONTEXT
  script:
    - |
      echo "Desplegando ticket-frontend en entorno preprod con kustomize"

      TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "Redeploy timestamp: $TS"

      sed -i "s/redeployAt: \".*\"/redeployAt: \"$TS\"/" "$KUSTOMIZE_DIR/params-configmap.yaml"

      kubectl apply -k $KUSTOMIZE_DIR
      kubectl rollout status deployment/ticket-frontend-deployment -n $NAMESPACE
  after_script:
    - rm -f kubeconfig
  only:
    - qa

build_etr:
  stage: build_etr
  tags:
    - ticket-v2-qa-runner
  script:
    - |
      if [ $(docker images $DOCKER_IMAGE_BASE:etr) ]; then
        docker rmi $DOCKER_IMAGE_BASE:etr
      fi
      echo "GENERANDO IMAGEN :ETR para $DOCKER_IMAGE_BASE ..."
      docker build --build-arg BUILD_ENV=etr -f Dockerfile -t $DOCKER_IMAGE_BASE:etr .
      docker push $DOCKER_IMAGE_BASE:etr
  only:
    - master_transmision

build_prod:
  stage: build_prod
  tags:
    - ticket-v2-qa-runner
  script:
    - |
      if [ $(docker images $DOCKER_IMAGE_BASE:$PRODUCTION_VERSION) ]; then
        docker rmi $DOCKER_IMAGE_BASE:$PRODUCTION_VERSION
      fi
      if [ $(docker images $DOCKER_IMAGE_BASE:latest) ]; then
        docker rmi $DOCKER_IMAGE_BASE:latest
      fi
      echo "PROD VERSION IS: $PRODUCTION_VERSION "

      docker build --build-arg BUILD_ENV=prod -f Dockerfile -t $DOCKER_IMAGE_BASE:latest .
      docker build --build-arg BUILD_ENV=prod -f Dockerfile -t $DOCKER_IMAGE_BASE:$PRODUCTION_VERSION .

      docker push $DOCKER_IMAGE_BASE:latest
      docker push $DOCKER_IMAGE_BASE:$PRODUCTION_VERSION
  only:
    - master

deploy_prod:
  stage: deploy_prod
  tags:
    - ticket-v2-qa-runner
  variables:
    KUSTOMIZE_DIR: k8s/overlays/prod
    NAMESPACE: ticket-prod
  before_script:
    - |
      ls -la
      kubectl version --client
      echo "$KUBECONFIG_CONTENT_PROD" | base64 -d > kubeconfig
      echo "$KUBECONFIG_CONTENT_PROD" | base64 -d | head -n 10
      export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
      kubectl config use-context $KUBECONFIG_CONTEXT
  script:
    - |
      echo "Desplegando ticket-frontend en entorno preprod con kustomize"

      TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "Redeploy timestamp: $TS"

      sed -i "s/redeployAt: \".*\"/redeployAt: \"$TS\"/" "$KUSTOMIZE_DIR/params-configmap.yaml"

      kubectl apply -k $KUSTOMIZE_DIR
      kubectl rollout status deployment/ticket-frontend-deployment -n $NAMESPACE
  after_script:
    - rm -f kubeconfig
  only:
    - master