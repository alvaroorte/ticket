
<p-pickList
  #pickList
  [source]="sourceProducts()"
  [target]="targetProducts()"
  [sourceHeader]="labels.availables"
  [targetHeader]="labels.assigneds"
  [dragdrop]="true"
  [responsive]="true"
  filterBy="name"
  [sourceFilterPlaceholder]="labels.search"
  [targetFilterPlaceholder]="labels.search"
  breakpoint="800px"
  [showSourceControls]="false"
  [showTargetControls]="false"
  (onMoveToSource)="removeItem($event)"
  (onMoveToTarget)="addItem($event)"
  (onMoveAllToSource)="allRemoveItems($event)"
  (onMoveAllToTarget)="allAddItems($event)"
  [moveToTargetProps]="buttonProps"
  [moveToSourceProps]="buttonProps"
  [moveAllToSourceProps]="buttonProps"
  [moveAllToTargetProps]="buttonProps">
  <ng-template let-item pTemplate="item">
    <div class="flex flex-wrap p-2 align-items-center gap-3">
      <div class="flex-1 flex flex-column gap-2">
        <span class="font-bold">
          @if (item.detail) {
            <i [class]="'mr-2 pi '+ item.detail"></i>
          } 
          {{ item.name }} 
        </span>
      </div>
    </div>
  </ng-template>
</p-pickList>
