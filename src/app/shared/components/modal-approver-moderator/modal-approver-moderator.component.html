<div class="grid">
    <div class="col-12">
        <p-dialog 
            [focusOnShow]="false" 
            [(visible)]="openModal" 
            [header]="modalTitle" 
            styleClass="w-11 md:w-4" 
            [modal]="true" 
            class="p-fluid">
            <ng-template pTemplate="content">
            
                <div class="grid">
                    <div class="form-group field mt-5 col-12">
                        <p-floatlabel>
                            <p-select inputId="approver"
                                [options]="userList()"
                                optionLabel="email"
                                appendTo="body"
                                optionValue="id"
                                [(ngModel)]="selectedApproverOrModeratorId"
                                styleClass="w-full"
                             />
                            <label for="approver" class="text-lg font-bold text-800">
                                <span class="text-red-500">*</span>
                                {{ labels.users }}
                            </label>
                        </p-floatlabel>
                    </div>
                </div>
                
            </ng-template>
            <ng-template pTemplate="footer">
                <div class="p-2 pb-3">
                    <button 
                        type="button" 
                        (click)="openModal = false" 
                        pButton pRipple 
                        [label]="labels.cancel" 
                        icon="pi pi-times" 
                        class="p-button-secondary p-button-rounded mr-2 p-button-sm sombra-black hover-secondary"
                    ></button>
                    <button 
                        type="submit" 
                        pButton pRipple 
                        [label]="labels.save"
                        [disabled]="!selectedApproverOrModeratorId"
                        icon="pi pi-sign-in"
                        [rounded]="true"
                        size="small"
                        class="mr-2 sombra-black hover-primary"
                        (click)="updateApproverOrModeartor()"
                    ></button>
                </div>
            </ng-template>
        </p-dialog>
    </div>
</div>
