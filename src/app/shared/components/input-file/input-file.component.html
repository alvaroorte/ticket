<div [class]="mode() === modeInputFile.BASIC? 'form-group field flex align-items-center m-0': 'mt-3'">
  <p-fileUpload #fileUploadInput
    [mode]="mode()"
    (onSelect)="loadFile($event)"
    (onRemove)="loadFile()"
    [multiple]="false"
    [accept]="typeFileAccept()"
    [maxFileSize]="maxSizeAllowed()"
    [pTooltip]="tooltips.uploadFile"
    [tooltipDisabled]="labelButton()? true: false"
    [chooseLabel]="labelButton()"
    [style]="{'width': 'fit-content'}"
    [showUploadButton]="false"
    [invalidFileSizeMessageSummary]="messages.invalidFileSize"
    [invalidFileSizeMessageDetail]="messages.invalidFileSizeDetail"
    [invalidFileTypeMessageSummary]="messages.invalidFileType"
    [invalidFileTypeMessageDetail]="messages.invalidFileTypeDetail(typeFileAccept())"
    [showCancelButton]="false"
    chooseIcon="pi pi-plus mr-1"
    uploadIcon="pi pi-plus mr-1"
    [chooseButtonProps]="chooseButtonProps"
   />
  @if (mode() === modeInputFile.BASIC && labelButton() != labels.uploadFile) {
    <p-button
      styleClass="ml-2 fadeinup animation-duration-300 hover-warn shadow-3 bg-orange-500"
      icon="pi pi-times"
      severity="warn"
      [rounded]="true"
      size="small"
      [pTooltip]="tooltips.deleteFile"
      (onClick)="clearFile()"
    ></p-button>
  }
</div>
