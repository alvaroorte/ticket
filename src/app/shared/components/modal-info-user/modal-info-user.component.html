<form [formGroup]="formCredential">

  <div class="grid">
    <div class="col-12">
      <p-dialog 
        [focusOnShow]="false"
        [(visible)]="openModal"
        [header]="labels.myInformation + ': ' + loginService.userEmail()"
        styleClass="w-11 md:w-6 lg:w-4"
        [modal]="true"
        class="p-fluid"
        appendTo="body">
        <ng-template pTemplate="content">
          <app-message-required-field />
          <div class="form-group field mt-2 fadeinup animation-duration-500 mt-5">
            <p-floatlabel>
              <p-inputNumber
                id="phone"
                [useGrouping]="false"
                [min]="0"
                formControlName="phone"
                class="w-full"
              />
              <label htmlFor="phone" class="text-lg font-bold lynch-800">{{ labels.myCellInternal }}</label>
            </p-floatlabel>
          </div>

          <div class="form-group field mt-6 fadeinup animation-duration-500">
            <p-floatlabel>
              <input type="text" pInputText id="ubication" formControlName="ubication" class="w-full" />
              <label htmlFor="ubication" class="text-lg font-bold lynch-800 required-field">{{ labels.myWorkPlace }}</label>
            </p-floatlabel>
            @if (formCredential.controls['ubication'].touched && formCredential.get('ubication')?.hasError('required')) {
              <small class="p-error block mt-2" >{{ messages.requiredField }}</small>
            }
            @if (formCredential.get('ubication')?.hasError('minlength')) {
              <small class="p-error block mt-2" >{{ messages.requiredMinLength }}</small>
            }
          </div>

          </ng-template>
          <ng-template pTemplate="footer">
            <div class="p-2 pb-3">
              <button
                type="button"
                (click)="openModal = false"
                pButton pRipple
                [label]="labels.cancel"
                icon="pi pi-times"
                severity="secondary"
                [rounded]="true"
                size="small"
                class="mr-2 shadow-3"
              ></button>
              <button
                type="button"
                pButton pRipple
                [label]="labels.save"
                icon="pi pi-sign-in"
                [rounded]="true"
                size="small"
                class="mr-2 shadow-3 hover-primary"
                (click)="saveData()"
                [disabled]="formCredential.invalid"
              ></button>
            </div>
          </ng-template>
        </p-dialog>
      </div>
    </div>
  </form>
