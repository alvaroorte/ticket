<p-floatlabel>
    <p-select 
        inputId="users-generic"
        [ngModel]="userId()"
        [options]="users()"
        optionLabel="email"
        optionValue="credentialId"
        [filter]="true"
        filterBy="email"
        (onChange)="setUser($event.value)"
        class="w-full"
        [showClear]="true"
        appendTo="body"
        emptyFilterMessage="No se encontraron coincidencias."
        emptyMessage="No se encontraron coincidencias."
        [virtualScroll]="true"
        [virtualScrollItemSize]="30"
        [filterPlaceholder]="placeholders.onDemandFilterInput"
        [showClear]="!isRequired()"
        (onFilter)="tryGetUsers($event.filter)"/>
    <label 
        for="users-generic" 
        [ngClass]="['text-lg font-bold text-800', isRequired? 'required-field': '']">
        {{ label() }}
    </label>
</p-floatlabel>
