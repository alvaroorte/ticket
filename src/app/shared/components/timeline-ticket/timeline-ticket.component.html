
<section #divComment class="my-2 mx-4 relative">
    <p-timeline [value]="timelineList()" [align]="'alternate'" class="w-full mt-2" >
        <ng-template pTemplate="marker" let-comment>
            <span class="border-circle w-2rem h-2rem text-xl shadow-3 flex align-items-center justify-content-center bg-teal-600"
                [pTooltip]="comment.createdAt | formatDateWhitHour"
                [tooltipPosition]="( comment.number % 2 == 0 )? 'right': 'left'">
                <i class="pi pi-calendar text-0"></i>
            </span>
        </ng-template>
        <ng-template pTemplate="content" let-comment>
            <p-card class="border-round-2xl mb-2 shadow-4 timeline-card">
                <div>
                    <h4 
                        class="flex justify-content-end mb-4 font-bold">  
                        <i class="pi pi-user mr-2"></i> {{ comment.userName }} 
                    </h4>
                    <p class="text-left" [innerHTML]="comment.comment" > </p>
                    <p class="mt-3 flex justify-content-end"> {{ comment.createdAt | formatDateWhitHour }} </p>
                </div>
            </p-card>
        </ng-template>
    </p-timeline>
    <p #modalEnd></p>
</section>
