<div class="container mx-3 mb-0 pb-4">
  <p-fieldset styleClass="sombra-black">
    <ng-template pTemplate="header">
      <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
        <h1 class="text-white text-2xl">Horario <span class="text-sm"> Gestión de horarios</span> </h1>
      </div>
    </ng-template>
    <div class="grid">
      <div class="col-12 fadeindown animation-duration-400">
        <div class="sombra-black border-round-xl p-2 surface-0">
          <app-toolbar-common
            tooltipCreate="Crear horario"
            [serviceGeneric]="scheduleService"
            [object]="scheduleSelected()"/>
          <app-modal-form />
          <app-modal-delete [serviceGeneric]="scheduleService" 
            [objectId]="scheduleSelected()?.id" />
          <app-generic-table [titleTable]="titleTable"
            [items]="schedules()"
            [tableColumnDefinitions]="tableColumnScheduleDefinitions"
            (onSelection)="setSchedule($event)"
            (requestData)="getSchedules()"
            (selfEmitter)="onTableSelfEmision($event)"
           />
        </div>
      </div>
    </div>
  </p-fieldset>
  @if (scheduleSelected()?.id) {
    <div class="col-12 fadeindown animation-duration-400 p-0 mt-3">
      <app-schedule-detail [scheduleId]="scheduleSelected().id" />
    </div>
  }
</div>
