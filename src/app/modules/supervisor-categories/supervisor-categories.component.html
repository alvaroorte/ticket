<app-toolbar-common  
    [serviceGeneric]="supervisorCategoryService" 
    tooltipCreate="Asignar categoría" 
    [showCreate]="supervisorId()? true : false"
    [showDelete]="false" 
    [showEdit]="false"
    [object]="supervisorCategorySelected()"/> 
<app-modal-form [supervisorId]="supervisorId()" />
<app-generic-table [titleTable]="titleTable"
    [items]="supervisorCategories()"
    [tableColumnDefinitions]="tableColumnSupervisorCategoryDefinitions"
    (onSelection)="setSupervisorCategory($event)"
    (requestData)="getBySupervisor()"
    (selfEmitter)="onTableSelfEmision($event)" />
