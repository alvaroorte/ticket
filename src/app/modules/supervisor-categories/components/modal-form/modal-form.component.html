<div class="grid">
    <div class="col-12">
        <p-dialog 
            [focusOnShow]="false" 
            [(visible)]="openModal" 
            styleClass="w-10" 
            [header]="titleForm" 
            [modal]="true" 
            (onHide)="actionsHideModal()"
            class="p-fluid"
            appendTo="body"
        >
            <ng-template pTemplate="content">
                <div class="card flex justify-content-center align-items-center mb-4 mr-8">
                    <label class="text-lg font-bold text-800 mr-3 required-field"> {{ labels.enterprise }} </label>
                    <p-select inputId="enterprises" 
                        [(ngModel)]="enterpriseId" 
                        [options]="enterprises()"  
                        optionLabel="name" 
                        optionValue="id" 
                        [filter]="true" 
                        filterBy="name"
                        appendTo="body"
                        [placeholder]="labels.placeholderSelectAOption"
                        (onChange)="getCategories()" />
                </div>
                   
                <app-table-double (add)="updateSupervisorCategories()" 
                    (allAdd)="updateSupervisorCategories()" 
                    (remove)="updateSupervisorCategories()" 
                    (allRemove)="updateSupervisorCategories()" 
                    [sourceProducts]="sourceProducts()"
                    [targetProducts]="targetProducts()"
                 />
            </ng-template>
        </p-dialog>
    </div>
</div>
