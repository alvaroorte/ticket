<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">Títulos de incidentes <span class="text-sm"> Gestión de títulos de incidentes</span> </h1>
            </div>
        </ng-template>
        <div class="grid">
            <div class="col-12 fadeindown animation-duration-400">
                <div class="sombra-black border-round-xl p-2 surface-0">
                    <app-toolbar-common
                        [serviceGeneric]="incidentTitleService"
                        [object]="incidentTitleSelected()"
                    /> 
                    <app-modal-form /> 
                    <app-modal-delete [serviceGeneric]="incidentTitleService" [objectId]="incidentTitleSelected()?.id" />
                    <app-generic-table [titleTable]="titleTable"
                        [items]="incidentTitles()"
                        [tableColumnDefinitions]="tableColumnDefinitions"
                        (onSelection)="setIncidentTitle($event)"
                        (requestData)="getIncidentTitles()"
                        (selfEmitter)="onTableSelfEmision($event)"
                     />
                </div>
            </div>
        </div>
    </p-fieldset>
</div>
