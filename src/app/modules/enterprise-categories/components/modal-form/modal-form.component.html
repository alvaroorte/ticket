<div class="grid">
    <div class="col-12">
        <p-dialog 
            [focusOnShow]="false" 
            [(visible)]="openModal" 
            styleClass="w-10" 
            [header]="tittleForm" 
            [modal]="true"
            (onHide)="actionsHideModal()"
             class="p-fluid"
             appendTo="body">
            <ng-template pTemplate="content">
                <div class="card flex justify-content-center align-items-center mb-4 mr-8">
                    <label class="text-lg font-bold text-800 mr-3"><span class="text-red-500">*</span> Equipo: </label>
                    <p-select inputId="team" 
                        [(ngModel)]="teamSelectedId" 
                        [options]="teams"  
                        optionLabel="name" 
                        optionValue="id" 
                        [filter]="true" 
                        filterBy="name"
                        [showClear]="true" 
                        [placeholder]="labels.placeholderSelectAOption"
                     />
                </div>
                   
                <app-table-double (add)="save(typeTableDoubleEnum.ADD)" 
                    (allAdd)="save(typeTableDoubleEnum.ADD)" 
                    (remove)="save(typeTableDoubleEnum.REMOVE)" 
                    (allRemove)="save(typeTableDoubleEnum.REMOVE)" 
                    [sourceProducts]="sourceProducts()"
                    [targetProducts]="targetProducts()"
                 />
            </ng-template>
        </p-dialog>
    </div>
</div>
