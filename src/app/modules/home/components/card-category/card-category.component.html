<article class="card cursor-pointer shadow-4">
  @if (category().image) {
    <img 
      class="image" 
      [src]="'data:image/png;base64,' + category().image" 
      alt="Imagen de la categoría"
    >
  } @else {
    <img class="image" src="/assets/images/endesyc_logo.avif" alt="Imagen no encontrada" >
  }
  <section class="body w-12">
    <h3
      class="lynch-500 text-center title font-size-title uppercase">
      {{ category().name }}
    </h3>
  </section>
  <div class="flex justify-content-center ">
    <section class="footer-card">
      @for (subCategory of category().subCategories; track subCategory.id) {
        <p > - {{ subCategory.name }}</p>
      }
    </section>
  </div>
</article>
