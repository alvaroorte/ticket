<app-stepper 
  [steps]="steps()" 
  [indexCurrent]="indexCurrent()" 
  (onChangeStep)="changedIndex($event)" 
/>
@if (indexCurrent() == 1) {
  <app-cards-categories
    [enterpriseId]="enterpriseSelectedId()"
    (onSelectedCategory)="setSelectedCategoryAndEnterprise($event)"
  />
}
@if (indexCurrent() == 2) {
  <app-form-ticket-requester 
    [category]="category()" 
    [hasCostCenter]="hasCostCenter()"
    [enterpriseId]="enterpriseSelectedId()" 
    [enterpriseName]="enterpriseSelectedName()" 
    (saveTicket)="saveTicket($event)" 
  />
}
