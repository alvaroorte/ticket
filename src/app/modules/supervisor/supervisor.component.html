<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">{{ labels.supervisors }} <span class="text-sm"> Gestión de supervisores</span> </h1>
            </div>
        </ng-template>
            <div class="grid">
                <div class="col-6 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-toolbar-common 
                            [serviceGeneric]="supervisorService" 
                            tooltipCreate="Crear supervisor"
                            [object]="supervisorSelected()"/> 
                        <app-form /> 
                        <app-modal-delete [serviceGeneric]="supervisorService" [objectId]="supervisorSelected()?.id" />
                        <app-generic-table [titleTable]="titleTable"
                            [items]="supervisors()"
                            [tableColumnDefinitions]="tableColumnSupervisorDefinitions"
                            (onSelection)="setSupervisor($event)"
                            (requestData)="getSupervisors()"
                            (selfEmitter)="onTableSelfEmision($event)"
                         />
                    </div>
                </div>
                <div class="col-6 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-supervisor-categories [supervisorId]="supervisorSelected()?.id" />
                    </div>
                </div>
            </div>
    </p-fieldset>
</div>
