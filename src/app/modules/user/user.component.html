<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl"> {{ labels.users }} <span class="text-sm"> Gestión de usuarios</span> </h1>
            </div>
        </ng-template>
            <div class="grid">
                <div class="col-12 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-modal-add-roles/>
                        <app-table-on-demand
                            [columns]="columns"
                            [dataList]="users()"
                            [totalElements]="totalElements()"
                            (eventloadItems)="loadUsers($event)"
                            (eventRowSelected)="setUser($event)"
                            (selfEmitter)="onTableSelfEmision($event)"
                        >
                            <ng-container leftToolbarTemplate>
                                <p-button 
                                    [label]="labels.addRoles"
                                    icon="pi pi-users"
                                    severity="info"
                                    [pTooltip]="tootips.addRoles"
                                    size="small"
                                    [rounded]="true"
                                    styleClass="shadow-3 hover-info fadeinup animation-ease-in-out animation-duration-300"
                                    (click)="openModalRoles()"
                                />
                            </ng-container>
                        </app-table-on-demand>
                    </div>
                </div>
            </div>
    </p-fieldset>
</div>
