<div class="container mx-0 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">División territorial <span class="text-sm"> Gestión de divisiones territoriales</span> </h1>
            </div>
        </ng-template>
            <div class="grid">
                <div class="col-12 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-toolbar-common
                            tooltipCreate="Crear división territorial"
                            [serviceGeneric]="territorialDivisionService"
                            [object]="territorialDivisionSelected()"
                        />
                        <app-modal-form-territorial-division [countryId]="countryId()"/>
                        <app-modal-delete [serviceGeneric]="territorialDivisionService"
                            [objectId]="territorialDivisionSelected()?.id" />
                        <app-generic-table [titleTable]="titleTable"
                            [items]="territorialDivisions()"
                            [tableProps]="tableProps"
                            [tableColumnDefinitions]="tableColumnTerritorialDivisionDefinitions"
                            (onSelection)="setTerritorialDivision($event)"
                            (requestData)="getByCountry()"
                            (selfEmitter)="onTableSelfEmision($event)" />
                    </div>
                </div>
            </div>
    </p-fieldset>
</div>
