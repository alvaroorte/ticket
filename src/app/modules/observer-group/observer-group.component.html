<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">Grupo de observadores <span class="text-sm"> Gestión de grupo de observadores</span> </h1>
            </div>
        </ng-template>
        <div class="grid">
            <div class="col-12 fadeindown animation-duration-400">
                <div class="sombra-black border-round-xl p-2 surface-0" [style]="{'max-width': '92vw'}">
                    <app-toolbar-common
                        [serviceGeneric]="observerGroupService"                        
                        [object]="observerGroupSelected()"/> 
                    <app-modal-form /> 
                    <app-modal-delete [serviceGeneric]="observerGroupService" [objectId]="observerGroupSelected()?.id" />
                    <app-generic-table [titleTable]="titleTable"
                        [items]="observerGroups()"
                        [tableColumnDefinitions]="tableColumnDefinitions"
                        (onSelection)="setRowSelected($event)"
                        (requestData)="getObserverGroups()"
                        (selfEmitter)="onTableSelfEmision($event)"
                     />
                </div>
            </div>
        </div>
    </p-fieldset>
</div>
