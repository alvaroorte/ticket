<div class="container mx-0 mb-0 pb-4">
  <p-fieldset styleClass="sombra-black">
    <ng-template pTemplate="header">
      <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
        <h2 class="text-white">Horario de trabajo detallado <span class="text-sm"> Gestión de horarios de trabajo</span> </h2>
      </div>
    </ng-template>
    <div class="grid">
      <div class="col-12 fadeindown animation-duration-400">
        <div class="sombra-black border-round-xl p-2 surface-0">
          <app-toolbar-common
            tooltipCreate="Crear horario de trabajo"
            [serviceGeneric]="scheduleDetailService" 
            [object]="scheduleDetailSelected()"
            >
            @if (scheduleId()) {
              <p-button icon="pi pi-chart-line"
                pTooltip="Ver gráfico de horarios"
                size="small"
                [rounded]="true"
                severity="help"
                styleClass="shadow-3 hover-help fadeinup animation-ease-in-out animation-duration-300"
                (click)="openModalGanttSchedule()"
               />
            }
          </app-toolbar-common>
          <app-modal-form-schedule-detail [scheduleId]="scheduleId()"/>
          <app-modal-delete [serviceGeneric]="scheduleDetailService" [objectId]="scheduleDetailSelected()?.id" />
          <app-generic-table [titleTable]="titleTable"
            [items]="scheduleDetails()"
            [tableProps]="tableProps"
            [tableColumnDefinitions]="tableColumnScheduleDetailDefinitions"
            (onSelection)="setScheduleDetail($event)"
            (requestData)="getBySchedule()"
            (selfEmitter)="onTableSelfEmision($event)" />
        </div>
      </div>
    </div>
  </p-fieldset>
  <app-modal-gantt-schedule [scheduleId]="scheduleId()" />
</div>
