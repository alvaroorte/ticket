<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl"> {{ labels.teams }} <span class="text-sm"> Gestión de equipos</span> </h1>
            </div>
        </ng-template>
            <div class="sombra-black border-round-xl p-2 surface-0">
                <app-toolbar-common
                    tooltipCreate="Crear Equipo" 
                    [serviceGeneric]="teamService"
                    [object]="teamSelected()"/> 
                <app-modal-form /> 
                <app-modal-delete [serviceGeneric]="teamService" [objectId]="teamSelected()?.id" />
                <app-generic-table [titleTable]="titleTable"
                    [items]="teams()"
                    [tableColumnDefinitions]="tableColumnTeamDefinitions"
                    (onSelection)="setTeam($event)"
                    (requestData)="getTeams()"
                    (selfEmitter)="onTableSelfEmision($event)"
                 />
            </div>
    </p-fieldset>
</div>
