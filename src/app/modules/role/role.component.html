<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">Seguridad <span class="text-sm"> Gestión de seguridad</span> </h1>
            </div>
        </ng-template>
            <div class="grid">
                <div class="col-6 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-toolbar-common 
                            [serviceGeneric]="roleService"
                            [object]="roleSelected()"
                        />
                        <app-form /> 
                        <app-modal-delete [serviceGeneric]="roleService" [objectId]="roleSelected()?.id"  />
                        <app-generic-table [titleTable]="titleTable"
                            [items]="roles()"
                            [tableColumnDefinitions]="tableColumnRoleDefinitions"
                            [tableProps]="tableProps"
                            (onSelection)="setRole($event)"
                            (requestData)="getRole()"
                            (selfEmitter)="onTableSelfEmision($event)"
                         />
                    </div>
                </div>
                <div class="col-6 fadeindown animation-duration-400">
                    <div class="sombra-black border-round-xl p-2 surface-0">
                        <app-permission />
                    </div>
                </div>
            </div>
    </p-fieldset>
    <app-assign-permissions [roleId]="roleSelected()?.id" />
</div>
