<app-toolbar-common 
    [serviceGeneric]="permissionService"
    [object]="permissionSelected()"    
/>
<app-form /> 
<app-modal-delete [serviceGeneric]="permissionService" 
    [objectId]="permissionSelected()?.id" 
    (onDeleteSuccess)="updatePermissionInRole()"
 />

<app-table-on-demand 
    [columns]="columns"
    [dataList]="permissions()"
    [rows]="5"
    [showFilterButton]="false"
    [totalElements]="totalElements"
    [titleTable]="titleTable"
    (eventloadItems)="loadPermissions($event)"
    (eventRowSelected)="setPermission($event)"
    (selfEmitter)="onTableSelfEmision($event)"
 />
