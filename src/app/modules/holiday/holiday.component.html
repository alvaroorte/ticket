<div class="container mx-3 mb-0 pb-4">
    <p-fieldset styleClass="sombra-black">
        <ng-template pTemplate="header">
            <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
                <h1 class="text-white text-2xl">Feriado <span class="text-sm"> Gestión de feriados</span> </h1>
            </div>
        </ng-template>
        <div class="grid">
            <div class="col-12 fadeindown animation-duration-400">
                <div class="sombra-black border-round-xl p-2 surface-0">
                    <app-toolbar-common
                        tooltipCreate="Crear feriado" 
                        [serviceGeneric]="holidayService"
                        [object]="holidaySelected()"/> 
                    <app-modal-form /> 
                    <app-modal-delete [serviceGeneric]="holidayService" [objectId]="holidaySelected()?.id" />
                    <app-generic-table [titleTable]="titleTable"
                        [items]="holidays()"
                        [tableColumnDefinitions]="tableColumnHolidayDefinitions"
                        (onSelection)="setHoliday($event)"
                        (requestData)="getHolidays()"
                        (selfEmitter)="onTableSelfEmision($event)"
                     />
                </div>
            </div>
        </div>
    </p-fieldset>
</div>
